[package]
name = "wind-installer"
version = "0.1.0"
edition = "2021"
description = "清风输入法 Windows 安装程序"
license = "MIT"

[package.metadata.installer]
# ── 显示信息 ──────────────────────────────────────────────
display_name    = "清风输入法"
publisher       = "清风输入法 项目"
start_menu_folder = "清风输入法"
window_title    = "清风输入法 安装向导"
# ── 应用标识（用于注册表键名、默认安装目录名等）────────────
app_id          = "WindInput"
# ── 可执行文件名 ──────────────────────────────────────────
main_exe        = "wind_input.exe"
setting_exe     = "wind_setting.exe"
# ── 安装行为 ──────────────────────────────────────────────
url_protocol    = "windinput"           # 留空则跳过 URL 协议注册
process_names   = "wind_setting,wind_portable,wind_input"  # 安装/卸载前终止的进程
acl_dlls        = "wind_tsf.dll,wind_tsf_x86.dll"          # 需要 ALL APP PACKAGES 权限的文件，留空则跳过
backup_dir      = "WindInput_Backup"    # 卸载备份到桌面时的目录名
portable_marker = "portable_mode"       # 便携模式标记文件名

[features]
# 默认启用 WindInput 专有功能；其他应用在自己的 Cargo.toml 中设 default = [] 即可禁用
default = ["ime", "font"]
ime  = []   # TSF 输入法注册（风输入法专用，依赖 wind_tsf.dll GUID/CLSID）
font = []   # 字体安装（风输入法附带字体，其他应用通常不需要）

[lib]
name = "wind_installer"
path = "src/lib.rs"

[dependencies]
# GUI 框架
windui = { path = "../wind-ui-rust" }

# 压缩
zstd = "0.13"
xz2 = "0.1"

# Windows API
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Security",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    "Win32_System_Memory",
    "Win32_UI_Input_KeyboardAndMouse",
] }

# 注册表操作
winreg = "0.52"

# 快捷方式
mslnk = "0.1"

# 工具
crc32fast = "1.4"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
ctrlc = "3"

[build-dependencies]
embed-resource = "2.4"
toml = "0.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[[bin]]
name = "wind-installer"
path = "src/main.rs"

[[bin]]
name = "wind-uninstaller"
path = "src/uninstaller_main.rs"

[[bin]]
name = "wind-packer"
path = "tools/packer/main.rs"
