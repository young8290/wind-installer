[package]
name = "wind-installer"
version = "0.1.0"
edition = "2021"
description = "清风输入法 Windows 安装程序"
license = "MIT"

[package.metadata.installer]
display_name = "清风输入法"
publisher = "清风输入法 项目"
start_menu_folder = "清风输入法"
window_title = "清风输入法 安装向导"

[lib]
name = "wind_installer"
path = "src/lib.rs"

[dependencies]
# GUI 框架
windui = { path = "../wind-ui-rust" }

# 压缩
zstd = "0.13"
xz2 = "0.1"

# Windows API
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Security",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    "Win32_System_Memory",
    "Win32_UI_Input_KeyboardAndMouse",
] }

# 注册表操作
winreg = "0.52"

# 快捷方式
mslnk = "0.1"

# 工具
crc32fast = "1.4"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
ctrlc = "3"

[build-dependencies]
embed-resource = "2.4"
toml = "0.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[[bin]]
name = "wind-installer"
path = "src/main.rs"

[[bin]]
name = "wind-uninstaller"
path = "src/uninstaller_main.rs"

[[bin]]
name = "wind-packer"
path = "tools/packer/main.rs"
