[package]
name = "wind-installer"
version = "0.1.0"
edition = "2021"
description = "清风输入法 Windows 安装程序"
license = "MIT"

# 应用身份配置已迁移到 app.toml（运行期清单），不再使用 Cargo.toml 元数据。

[features]
# 输入法/字体注册已改为运行期清单驱动（见 app.toml 的 [ime]/[[font]] 段），不再是编译期开关。
default = ["frameless"]
frameless = []          # 无边框自定义标题栏（主题色标题栏代替系统标题栏）
packer    = ["dep:editpe"]  # wind-packer 所需（写 EXE 图标）

[lib]
name = "wind_installer"
path = "src/lib.rs"

[dependencies]
# 压缩
zstd = "0.13"
xz2 = "0.1"

# 工具（跨平台：archive/manifest 模块与 wind-packer 仅依赖这些，可在 Linux 原生构建）
crc32fast = "1.4"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
ctrlc = "3"
# 仅 wind-packer 需要（写 EXE 图标，纯 Rust 跨平台，无外部依赖）；installer/uninstaller 不引入
editpe = { version = "0.2.3", features = ["images"], optional = true }

# Windows-only 依赖（installer/uninstaller/ui/util 模块用）。隔离到 cfg(windows)
# 后，wind-packer 可在 Linux 宿主原生构建（archive 纯 IO，无需 wine）。
[target.'cfg(windows)'.dependencies]
# GUI 框架（ui 模块用）
windui = { path = "../wind-ui-rust" }
# Windows API
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Security",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    "Win32_System_Memory",
    "Win32_UI_Input_KeyboardAndMouse",
] }
# 注册表操作
winreg = "0.52"
# 快捷方式
mslnk = "0.1"

[build-dependencies]
embed-resource = "2.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[[bin]]
name = "wind-installer"
path = "src/main.rs"

[[bin]]
name = "wind-uninstaller"
path = "src/uninstaller_main.rs"

[[bin]]
name = "wind-packer"
path = "tools/packer/main.rs"
required-features = ["packer"]
