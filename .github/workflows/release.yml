name: Release

# 触发:
#   - push tag v*                       → 只构建全部产物 + SHA256SUMS，不创建 Release
#   - workflow_dispatch (publish=true)  → 额外创建 Release（需手动勾选，是"主动 release"的唯一入口）
#   - workflow_dispatch (publish=false) → 同 push tag，只产出 artifact 供人工核对
#
# 本项目当前主要以源码方式被其它项目集成，打 tag 只是标版本，不代表要发二进制 Release；
# 是否发布交给人工判断，故 release job 不再随 tag push 自动触发。
# 手动触发时可在 "Use workflow from" 选择目标 tag 作为 ref，若不方便选 ref，
# 也可以直接填 tag 输入项显式指定要发布的 tag。
#
# 产出的二进制供 WindInput 仓的打包流水线消费:
#   dev.ps1（Windows 本机/CI）  需要 stub + uninstaller + packer(.exe)
#   pack-installer.sh（Linux）  需要 stub + uninstaller + packer(Linux 原生)
# 故 stub/uninstaller 只有 Windows 版，packer 两个平台都出。
#
# 资产命名不带版本号——版本由 Release tag 表达，下载方写死文件名即可:
#   gh release download v0.1.0 -p 'wind-installer-windows-x64.exe'
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: '创建 GitHub Release（默认只构建产物，不发布）'
        type: boolean
        default: false
      tag:
        description: '要发布的 tag（留空则用当前触发所在的 ref）'
        type: string
        default: ''

permissions:
  contents: write     # 创建 Release

jobs:
  windows:
    # 与 ci.yml 同一 runner。这里刻意钉死 windows-2022 而非 latest:
    # 发布产物的工具链应当是明确、稳定、可回溯的，不该被 runner 镜像的静默升级带走。
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: 构建 (release)
        run: |
          cargo build --locked --release --bin wind-installer --bin wind-uninstaller
          cargo build --locked --release --bin wind-packer --features packer

      # ── 发布门禁:自包含校验 ──────────────────────────────────────────────
      # 逻辑在 scripts/verify-static-crt.ps1（含为何必须校验、为何不信构建配置的说明）。
      # 刻意不内联在这里:内联的校验没法在本地跑，只能靠照抄一份来验证，而照抄的副本
      # 会连 bug 一起抄走。packer 只跑在构建机上，不在校验之列。
      - name: 校验 Windows 产物静态链接 CRT
        shell: pwsh
        run: ./scripts/verify-static-crt.ps1 -Path target/release/wind-installer.exe, target/release/wind-uninstaller.exe

      - name: 整理产物
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/wind-installer.exe   dist/wind-installer-windows-x64.exe
          Copy-Item target/release/wind-uninstaller.exe dist/wind-uninstaller-windows-x64.exe
          Copy-Item target/release/wind-packer.exe      dist/wind-packer-windows-x64.exe
          Get-ChildItem dist | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # 只出 packer:stub/uninstaller 是 cfg(windows) 代码，Linux 上不存在。
      # Linux 侧打包流水线用交叉编译的 stub，那是消费方的事，不由本仓发布。
      - name: 构建 wind-packer (release)
        run: cargo build --locked --release --bin wind-packer --features packer

      - name: 整理产物
        run: |
          mkdir -p dist
          cp target/release/wind-packer dist/wind-packer-linux-x64
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: dist/*
          if-no-files-found: error

  release:
    needs: [windows, linux]
    # 唯一的发布入口：只有手动触发且显式勾选 publish 才会创建 Release。
    # push tag 本身不再触发这个 job——tag 只是打版本号，不代表要发布二进制。
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # 校验和与产物同目录发布:消费方下载后可离线核对，不必信任传输过程。
      - name: 汇总并生成 SHA256SUMS
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          cd dist
          # 显式 glob 而非 `*`：后者是否把正在创建的 SHA256SUMS 算进自己，
          # 取决于 shell 展开与重定向的先后顺序——不值得依赖这种隐晦规则。
          sha256sum wind-* > SHA256SUMS
          cat SHA256SUMS

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          TAG="${TAG_INPUT:-${GITHUB_REF_NAME}}"
          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${TAG}" \
            --generate-notes \
            dist/*
