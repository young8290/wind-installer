# Release 说明的自动分类。
# release.yml 的 `gh release create --generate-notes` 会读取本文件，
# 按 PR 标签把变更归入下列分组。
changelog:
  categories:
    - title: "🆕 新功能"
      labels:
        - enhancement
        - feature
    - title: "🐛 Bug 修复"
      labels:
        - bug
        - fix
    - title: "📦 归档格式与兼容性"
      labels:
        - archive-format
    - title: "🔧 维护"
      labels:
        - chore
        - maintenance
    - title: "📖 文档"
      labels:
        - documentation
    - title: "⚡ 性能"
      labels:
        - performance
    - title: "🔨 重构"
      labels:
        - refactor
  exclude:
    labels:
      - skip-changelog
    authors:
      - dependabot
