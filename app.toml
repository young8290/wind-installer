# Moodflow Windows reference manifest. Production source: Moodflow/config/app.toml.
# Pass --config to use the current product manifest when building.
# ============================================================================
#  Moodflow 安装器清单（供 moodflow-packer 使用）
# ============================================================================
#  本文件归属 Moodflow 仓库，描述Moodflow 输入法的完整安装配置。
#
#  动态字段由构建脚本通过 CLI 参数注入，无需修改本文件：
#    moodflow-packer build \
#      --config config/app.toml \
#      --version <VERSION>      # 覆盖 app.version
#      --source-dir <DIR>       # 覆盖 package.source_dir
#      --stub moodflow-installer.exe
# ============================================================================

[app]
id              = "Moodflow"
display_name    = "Moodflow 输入法"
version         = "0.0.0"           # 构建时由 --version 覆盖，此处为占位
publisher       = "Moodflow 输入法项目"
description     = "懂你心情的 AI 输入陪伴"
main_exe        = "moodflow_core.exe"
setting_exe     = "wind_setting.exe"
start_menu_folder = "Moodflow 输入法"
window_title    = "Moodflow 输入法安装向导"
url_protocol    = "moodflow"
agreement_url   = ""
portable_marker = "portable_mode"
# Moodflow：moodflow_hub 是 Moodflow 主程序（Hub），升级、卸载前要和核心一起结束（11 FR-OPS-02）
process_names   = ["wind_setting", "wind_portable", "moodflow_core", "moodflow_hub"]
acl_dlls        = ["moodflow_tsf.dll", "moodflow_tsf_x86.dll"]
legacy_files    = []
legacy_dirs     = []

[integrity]
data_manifest = "data/manifest.json"

[ui]
install_win   = { w = 520, h = 420 }
uninstall_win = { w = 480, h = 420 }

[ime]
clsid        = "{EF62EE30-5ECF-413A-A476-48D1F29E827C}"
profile_guid = "{EF62EE31-5ECF-413A-A476-48D1F29E827C}"
lang_id      = "0804"
dll_x64      = "moodflow_tsf.dll"
dll_x86      = "moodflow_tsf_x86.dll"
# 安装前清扫「指向已消失 DLL 的悬空注册」：旧版（含同 CLSID 的 Go 版）卸载不净时，
# HKCR\CLSID、CTF\TIP、旧 NSIS 的 RunOnce 会残留并指向已删 DLL，导致部分应用无法开启输入法。
# 缺省 false（通用安装器不擅自改注册表）；只删悬空项，按本段 clsid/profile 变体隔离，
# 故 dev（DEB 系列）与 release（EE 系列）各自只清自己那套键、互不影响。
sweep_residue = true
# TSF DLL 的系统目录子路径：置空则就地注册（DLL 留在安装目录）；非空则把 DLL 复制到
# %WINDIR%\System32\<此路径>\（x86 到 SysWOW64\<此路径>\）并对系统副本 regsvr32。
# 开启 Trusted Mode 的游戏（CS2 等）只放行系统目录下的 in-proc DLL，故输入法须置此项；
# 判据与实测对照见 docs/design/game-compat-tsf-uielement.md。取值对齐 inbox IME 的
# IME\<产品名>\ 布局。
#
# ⚠️ 置此项还要求 DLL 已代码签名，两个条件缺一不可——游戏侧同时校验路径与签名。
# ⚠️ 置此项后安装器会一并写 HKLM\Software\<[app] id>\InstallDir：DLL 搬离安装目录后
#    只能靠它回指（读端 moodflow_tsf/src/IPCClient.cpp 的 _ResolveAppBaseDir），缺了拉不起服务。
system_subdir = "IME/Moodflow"

[[font]]
file         = "HeiTiZiGen.ttf"
display_name = "黑体字根 (TrueType)"
source_rel   = "data/schemas/wubi86/HeiTiZiGen.ttf"

# ── 开机自启动：整段缺省即不注册（输入法必须自启，故必须声明本段）────────────
#    exe 省略即回退 app.main_exe —— 本段对 dev/release 变体通用（各自 main_exe 不同）
[autostart]
enabled = true

# ── 快捷方式：整段缺省即一个都不创建 ─────────────────────────────────────────
#    target/name 用占位符 {setting_exe}/{main_exe}/{display_name}，安装器运行期按
#    [app] 字段替换 —— 一份配置对 dev/release 通用。{setting_exe} 未配置时该项自动跳过。
# Moodflow：开始菜单里的“Moodflow”打开 Hub（11 FR-OPS-01）。Windows 通知要求开始菜单里有一个带
# 应用标识（AppUserModelID）的快捷方式，且 Hub 发通知时用同一个标识。Tauri 用 identifier
# 作这个标识，故此处必须与 moodflow_hub/src-tauri/tauri.conf.json 的 identifier 逐字一致。
[[shortcut]]
target            = "moodflow_hub.exe"
name              = "Moodflow"
location          = "start_menu"
description       = "和晴晴聊聊、看看心情、管理日程"
app_user_model_id = "com.moodflow.hub"

[[shortcut]]
target   = "{setting_exe}"
name     = "{display_name} 设置"
location = "start_menu"                   # start_menu | desktop

[[shortcut]]
target   = "uninstall.exe"
name     = "卸载 {display_name}"
location = "start_menu"

# ── 应用运行期自己写的自启动值：卸载时一并删除（11 FR-OPS-02）──────────────────
#    Moodflow：Hub 设置里的“登录时后台启动”由 Hub 自己写 HKCU\...\Run，安装器没写过、回执里
#    没有，不声明的话卸载后会留下一条指向已删 exe 的启动项。安装时只把值名记进回执。
#    约定：Hub 写这一项时值名用 MoodflowHub（tauri-plugin-autostart 用 Builder::app_name
#    设定）；“Moodflow”是该插件不设 app_name 时的缺省值名（取 productName），一并兜底。
[runtime_autostart]
value_names = ["MoodflowHub", "Moodflow"]

# ── 安装完成后的启动行为：整段缺省即装完不启动 ───────────────────────────────
#    exe 省略即回退 app.main_exe
[startup]
prestart = true

# ── 用户数据目录配置：整段缺省即不写 ─────────────────────────────────────────
#    首次安装时把向导中选定的数据目录写入 %LOCALAPPDATA%\Moodflow\datadir.conf，
#    供主程序启动时读取（读端在 moodflow-config/src/variant.rs 的 custom_userdata_dir）。
#    升级时跳过以保留用户既有配置。
[datadir]
conf_file = "datadir.conf"
# 卸载删除用户数据前的安全判据：datadir.conf 是用户可编辑的明文路径，而下游动作是
# remove_dir_all + 拷到桌面。目录非空时必须命中其一，否则跳过删除（空目录一律放行）。
markers = ["config.toml", "compat.toml", "userdata.redb", "wind_setting.toml", "schemas", "themes"]

# ── 本机数据目录清理：%LOCALAPPDATA%\Moodflow 下由主程序运行期创建的东西 ────
#    不声明这一段，卸载后这些会原样留下（连同目录本身）——安装器只撤销自己写过的
#    东西（回执），主程序写的它无从得知。实测残留：logs/ 约 4 MB、cache/ 上百 MB。
#
#    ⚠️ 节名与便携版的 `<安装根>\localdata\` 目录**同名但不同物**：这一段的作用域根恒是
#    `%LOCALAPPDATA%\{app.id}`（见 moodflow-installer 的 manifest 校验），只服务安装版卸载；
#    便携版没有卸载器，整个目录由用户自己删。两者同名纯属巧合，改一边不要顺手改另一边。
#
#    cache_dirs  →「清除本地词库缓存」勾选。两项都是可重建产物：
#      cache  词库 .wdat/.wridx（moodflow-config 的 Paths::cache_dir）
#      logs   主程序 / wind_setting / TSF DLL 三方的日志，含 tsf_log/ 与 tsf_log_config
#             （moodflow_tsf 的 FileLogger 直接往这里写，它不经过主程序的日志栈）
#    state_files →「删除用户词库和配置数据」勾选。删了就没了，故跟随那个危险勾选：
#      state.toml        工具栏位置等本机状态
#      user_config.seen  「用户配置曾存在」标记；留着会让重装后的漫游配置探测
#                        以为用户定制过，从而白等一轮漫游挂载
#      userdata.redb     **旧布局遗留**。现役位置在用户数据目录（见 [datadir].markers），
#                        但 2026-06 之前的版本把它写在这里，老机器上仍有一份。
#                        列在这里只为清掉那份历史残留，不影响现役路径。
#    Moodflow：hub 是 Moodflow 主程序的数据目录（数据库、对话、日程、密钥，03 第 5.2 节），跟随
#          「删除用户数据」勾选；那个勾选在卸载向导里默认不选中（11 FR-OPS-02）。
[localdata]
cache_dirs  = ["cache", "logs"]
state_files = ["state.toml", "user_config.seen", "userdata.redb", "hub"]
remove_dir_when_empty = true

# ── 系统运行时依赖（02 C-PLT-06、11 NFR-COMP-06）─────────────────────────────
#    Moodflow：Hub 的界面由 WebView2 渲染。Windows 11 自带；Windows 10 可能没有。装完后检测，
#    缺了就运行随包的微软在线引导程序（静默、需联网）；仍缺则完成页提示并给下载链接。
#    输入法本身不依赖它。引导程序由 dev.ps1 打包时下载到 redist\ 并校验微软签名；
#    没打进 Hub 的包会连同本段一起去掉。GUID 是微软公布的 WebView2 运行时固定值。
[[prerequisite]]
name      = "Microsoft Edge WebView2 运行时"
detect    = [
  { key = 'HKLM\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}', value = "pv" },
  { key = 'HKCU\Software\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}', value = "pv" },
]
installer = "redist/MicrosoftEdgeWebview2Setup.exe"
args      = "/silent /install"
url       = "https://developer.microsoft.com/microsoft-edge/webview2/"

# ── 界面文案：留空即用中性默认（不含「输入法」「词库」字样）──────────────────
#    安装器内置默认是领域中性的，输入法专用措辞需在此显式声明
[strings]
data_dir_hint       = "词库、配置路径"
mode_hint           = "标准安装注册输入法到系统；便捷模式仅解压文件，不修改系统"
# Moodflow：协议全文由 dev.ps1 拼出（config\installer-license.txt + 仓库根 LICENSE），打包时读进清单
agreement_text      = "《许可协议与开源声明》"
user_data_label     = "删除 Moodflow 数据、用户词库和配置数据"
cache_label         = "清除本地词库缓存"
delete_data_confirm = "将永久删除 {path} 下的所有词库和配置数据，以及 Moodflow 的心情记录、日程、对话和设置，卸载后无法恢复。\nMoodflow 数据不在备份范围内。\n\n确定要勾选删除吗？"
# Moodflow：完成页提示（11 第 155 行）
finish_note         = "按 Win + Space 切换到Moodflow 输入法\n从开始菜单打开「Moodflow」，和晴晴聊聊"

# ── 打包参数 ──────────────────────────────────────────────────────────────────
# source_dir 和 version 由构建脚本通过 CLI 覆盖；此处为本地开发默认值。
[package]
compression = "lzma"
source_dir  = "../Moodflow/build"            # 相对本文件：Moodflow/build/（本地默认）
output_name = "Moodflow-Setup"
output_dir  = "./dist"
# 品牌资产在本仓 assets\（相对本文件解析）。切勿指回 moodflow-installer/assets/ ——
# 那是通用生成器的中性兜底图（W 字标），借用会让安装界面顶着别人的标识。
logo        = "assets/logo.png"
icon        = "assets/installer.ico"

# ── PE 资源版本信息（供 moodflow-packer 在打包期注入安装程序/卸载程序的详细信息）──
[package.version_info]
company_name      = "Moodflow 输入法项目"
file_description  = "Moodflow 输入法安装程序"
# file_version      = "0.0.0.0"       # 缺省时自动读取 app.version (会被 CLI --version 覆盖并格式化为4位)
product_name      = "Moodflow 输入法"
# product_version   = "0.0.0.0"       # 缺省时自动读取 app.version (会被 CLI --version 覆盖并格式化为4位)
copyright         = "Copyright (C) Moodflow 输入法"
# original_filename = "Moodflow-Setup.exe" # 缺省时自动生成
